pluginManagement {
	repositories {
		maven {
			url = 'https://maven.aliyun.com/repository/gradle-plugin'
			content { excludeGroupByRegex 'net\\.fabricmc(\\..*)?' }
		}
		maven {
			url = 'https://maven.aliyun.com/repository/public'
			content { excludeGroupByRegex 'net\\.fabricmc(\\..*)?' }
		}
		maven {
			url = 'https://maven.aliyun.com/repository/google'
			content { excludeGroupByRegex 'net\\.fabricmc(\\..*)?' }
		}
		maven {
			url = "https://maven.fabricmc.net"
			name = "FabricMC"
		}
		gradlePluginPortal()
	}
}

plugins {
	id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}

rootProject.name='neofabric-loader'

if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
	throw new UnsupportedOperationException("Fabric Loader requires Java 21+ to build.")
}

include "minecraft"
include "junit"
// Default local builds cover every version. CI selects one independent Loom consumer per runner.
def testedMinecraftVersions = ["1.20.1", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6", "1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"]
def selectedMinecraftVersion = providers.gradleProperty('neofabric.minecraftTestVersion').getOrElse('all')
if (!(selectedMinecraftVersion in ['all', 'none']) && !testedMinecraftVersions.contains(selectedMinecraftVersion)) {
	throw new GradleException("Unknown integration-test Minecraft version: ${selectedMinecraftVersion}")
}
testedMinecraftVersions.each { version ->
	if (selectedMinecraftVersion == 'all' || selectedMinecraftVersion == version) {
		include(version == '1.20.1' ? 'minecraft:minecraft-test' : "minecraft:minecraft-test-${version}")
	}
}
